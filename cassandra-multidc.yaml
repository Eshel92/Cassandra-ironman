---
# ClientConfig tells the k8ssandra operator on dc1 how to reach dc2
apiVersion: config.k8ssandra.io/v1beta1
kind: ClientConfig
metadata:
  name: dc2
  namespace: k8ssandra-operator
spec:
  contextName: kind-dc2
  kubeConfigSecret:
    name: dc2-kubeconfig
---
# K8ssandraCluster spanning both DCs
apiVersion: k8ssandra.io/v1alpha1
kind: K8ssandraCluster
metadata:
  name: cassandra-cluster
  namespace: k8ssandra-operator
spec:
  cassandra:
    serverVersion: "4.1.8"
    storageConfig:
      cassandraDataVolumeClaimSpec:
        storageClassName: standard
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
    config:
      jvmOptions:
        heapSize: 512M
    networking:
      hostNetwork: false
    datacenters:
      - metadata:
          name: dc1
        k8sContext: ""
        size: 1
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi
      - metadata:
          name: dc2
        k8sContext: kind-dc2
        size: 1
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi
