---
# ClientConfig tells the k8ssandra-operator on DC1 how to reach the DC2 k8s API.
# Applied to: kind-sub-dc1
#
# The operator on DC1 is the "control plane" — it manages both DCs.
# It needs API access to DC2's cluster to create the CassandraDatacenter there.
# The kubeconfig secret (sub-dc2-kubeconfig) contains credentials for DC2's API server.
#
# NOTE: The kubeconfig secret must be created separately (see README).
apiVersion: config.k8ssandra.io/v1beta1
kind: ClientConfig
metadata:
  name: sub-dc2
  namespace: k8ssandra-operator
spec:
  contextName: kind-sub-dc2
  kubeConfigSecret:
    name: sub-dc2-kubeconfig
