---
# Per-node Cassandra config for DC2
# Applied to: kind-sub-dc2
#
# Same mechanism as DC1. See 06-per-node-config-dc1.yaml for detailed explanation.
# This pod gets MetalLB IP 172.19.255.11 from the dc2-pool.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cassandra-dc2-per-node-config
  namespace: k8ssandra-operator
data:
  cassandra-cluster-dc2-default-sts-0_cassandra.yaml: |
    broadcast_address: 172.19.255.11
    broadcast_rpc_address: 172.19.255.11
