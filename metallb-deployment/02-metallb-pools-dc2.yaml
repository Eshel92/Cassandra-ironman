---
# DC2 MetalLB IP pool and L2 advertisement
# Applied to: kind-sub-dc2
# IPs are in a different range than dc1 to avoid conflicts.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: dc2-pool
  namespace: metallb-system
spec:
  addresses:
    - 172.19.255.11-172.19.255.20
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: dc2-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - dc2-pool
