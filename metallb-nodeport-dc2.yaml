---
# NodePort service for host access to dc2 Cassandra via localhost:9043
# kind extraPortMappings maps hostPort 9043 -> containerPort 30043 (this NodePort)
apiVersion: v1
kind: Service
metadata:
  name: cassandra-dc2-nodeport
  namespace: k8ssandra-operator
spec:
  type: NodePort
  selector:
    cassandra.datastax.com/datacenter: dc2
  ports:
    - name: native
      port: 9042
      targetPort: 9042
      nodePort: 30043
      protocol: TCP
