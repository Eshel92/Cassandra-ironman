---
# Per-node Cassandra config for DC1
# Applied to: kind-sub-dc1
#
# HOW IT WORKS:
# The K8ssandraCluster CR references this ConfigMap via "perNodeConfigMapRef".
# When a Cassandra pod starts, cass-operator's config-builder init container
# looks for a key matching "<pod-name>_cassandra.yaml" in this ConfigMap.
# It merges the YAML fragment into the final cassandra.yaml BEFORE Cassandra starts.
#
# KEY FORMAT: <pod-name>_<config-file>.yaml
#   - cassandra-cluster-dc1-default-sts-0  = pod name (from the StatefulSet)
#   - cassandra.yaml                       = the config file to merge into
#
# WHAT WE SET:
#   broadcast_address:     The IP this node tells OTHER nodes to use when talking to it.
#                          Without this, Cassandra broadcasts its pod IP (10.30.x.x)
#                          which is unreachable from the other kind cluster.
#   broadcast_rpc_address: The IP this node tells CLIENTS to connect to.
#                          Same MetalLB IP so CQL clients can reach it externally.
#
# SCALING: If you add more nodes (size: 2, 3, etc.), add more entries:
#   cassandra-cluster-dc1-default-sts-1_cassandra.yaml: |
#     broadcast_address: 172.19.255.2
#     broadcast_rpc_address: 172.19.255.2
apiVersion: v1
kind: ConfigMap
metadata:
  name: cassandra-dc1-per-node-config
  namespace: k8ssandra-operator
data:
  cassandra-cluster-dc1-default-sts-0_cassandra.yaml: |
    broadcast_address: 172.19.255.1
    broadcast_rpc_address: 172.19.255.1
