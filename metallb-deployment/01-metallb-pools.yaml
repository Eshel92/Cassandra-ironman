---
# DC1 MetalLB IP pool and L2 advertisement
# Applied to: kind-sub-dc1
# These IPs must be within the Docker "kind" network range (172.19.0.0/16)
# so both kind clusters can route to them.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: dc1-pool
  namespace: metallb-system
spec:
  addresses:
    - 172.19.255.1-172.19.255.10
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: dc1-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - dc1-pool
