---
# Per-pod LoadBalancer service for dc2 Cassandra node 0
# MetalLB assigns an external IP from dc2-pool (172.19.255.11-20)
# This IP becomes the pod's broadcast_address so other DCs can reach it
apiVersion: v1
kind: Service
metadata:
  name: cassandra-dc2-node-0-lb
  namespace: k8ssandra-operator
  labels:
    app: cassandra-lb
    datacenter: dc2
spec:
  type: LoadBalancer
  selector:
    cassandra.datastax.com/datacenter: dc2
    cassandra.datastax.com/rack: default
    statefulset.kubernetes.io/pod-name: cassandra-cluster-dc2-default-sts-0
  ports:
    - name: native
      port: 9042
      targetPort: 9042
      protocol: TCP
    - name: internode
      port: 7000
      targetPort: 7000
      protocol: TCP
    - name: mgmt-api
      port: 8080
      targetPort: 8080
      protocol: TCP
