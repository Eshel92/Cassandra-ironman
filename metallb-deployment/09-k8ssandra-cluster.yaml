---
# K8ssandraCluster — multi-DC Cassandra using MetalLB for cross-cluster networking
# Applied to: kind-sub-dc1 (the control-plane cluster)
#
# HOW MULTI-DC WORKS WITH METALLB:
#
#   Problem: Two kind clusters have isolated pod networks (10.30.x.x and 10.40.x.x).
#   Pods in dc1 can't reach pods in dc2 by pod IP.
#
#   Solution: Give each Cassandra pod an external MetalLB IP on the shared Docker
#   network (172.19.0.0/16). Tell Cassandra to "broadcast" that IP instead of its
#   pod IP. Now all nodes gossip over MetalLB IPs which are routable between clusters.
#
#   Three pieces make this work:
#
#   1. LoadBalancer Services (04/05-*.yaml)
#      → MetalLB assigns each pod an external IP
#
#   2. perNodeConfigMapRef (06/07-*.yaml)
#      → Injects broadcast_address=<MetalLB IP> into each pod's cassandra.yaml
#      → cass-operator's config-builder merges this at startup
#
#   3. additionalSeeds (below)
#      → Tells Cassandra about nodes in the OTHER DC using MetalLB IPs
#      → Without this, DCs would never discover each other
#
# WHAT IS additionalSeeds?
#   Cassandra uses "seeds" for initial cluster discovery. Within a DC, cass-operator
#   manages seeds automatically via headless services. But for CROSS-DC discovery,
#   we need to explicitly tell each DC about at least one node in the other DC.
#   We list BOTH DCs' MetalLB IPs here so seeds are known globally.
#   This field is at the cassandra level (not per-DC) in K8ssandraCluster.
#
# WHAT IS perNodeConfigMapRef?
#   A reference to a ConfigMap containing per-pod cassandra.yaml overrides.
#   cass-operator has a built-in init container (config-builder) that:
#   1. Reads the global Cassandra config
#   2. Looks up the ConfigMap for a key matching "<my-pod-name>_cassandra.yaml"
#   3. Deep-merges the YAML fragment into the config
#   4. Writes the final cassandra.yaml to the config volume
#   All of this happens BEFORE the Cassandra process starts.
#
apiVersion: k8ssandra.io/v1alpha1
kind: K8ssandraCluster
metadata:
  name: cassandra-cluster
  namespace: k8ssandra-operator
spec:
  cassandra:
    serverVersion: "4.1.8"
    storageConfig:
      cassandraDataVolumeClaimSpec:
        storageClassName: standard
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
    config:
      jvmOptions:
        heapSize: 512M
    networking:
      hostNetwork: false
    # Cross-DC seed IPs — both DCs' MetalLB IPs so they can discover each other
    additionalSeeds:
      - "172.19.255.1"
      - "172.19.255.11"
    datacenters:
      - metadata:
          name: dc1
        k8sContext: ""
        size: 1
        perNodeConfigMapRef:
          name: cassandra-dc1-per-node-config
        serviceAccount: cassandra-metallb
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi
      - metadata:
          name: dc2
        k8sContext: kind-sub-dc2
        size: 1
        perNodeConfigMapRef:
          name: cassandra-dc2-per-node-config
        serviceAccount: cassandra-metallb
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi
